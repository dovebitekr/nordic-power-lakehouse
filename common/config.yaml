# Google Cloud Platform (GCS Data Lake & BigQuery Data Warehouse) configuration
gcp:
  project_id: "project-4bb54fe6-af46-421c-bc7"
  region: "us-central1"
  bq_location: "US"
  gcs_bucket: "nordic-power-lakehouse-fi-data"
  bq_dataset: "nordic_power_analytics"

# ENTSO-E Transparency Platform API configuration (Finland bidding zone)
entsoe:
  base_url: "https://web-api.tp.entsoe.eu/api"
  zone: "10YFI-1--------U"
  process_type: "A16"
  document_type: "A44"
  table_name: "day_ahead_price"
  partition_cols:
    - year
  datasets:
    unit_generation:
      document_type: "A73"
      process_type: "A16"
      table_name: "unit_generation"
      output_file_template: "FI_A73_{}_{}.xml"
      max_chunk_days: 1
      partition_cols:
        - year
    fuel_generation:
      document_type: "A75"
      process_type: "A16"
      table_name: "fuel_generation"
      output_file_template: "FI_A75_{}_{}.xml"
      max_chunk_days: 7
      partition_cols:
        - year
    day_ahead_price:
      document_type: "A44"
      table_name: "day_ahead_price"
      output_file_template: "FI_{}_{}.xml"
      max_chunk_days: 30
      partition_cols:
        - year

# Open-Meteo Finnish weather configuration
weather:
  base_url: "https://historical-forecast-api.open-meteo.com/v1/forecast"
  output_file_template: "{}_{}_{}.json"
  table_name: "finnish_weather"
  partition_cols:
    - year
  demand_hub:
    station_id: "FI_HEL"
    latitude: 60.1699
    longitude: 24.9384
  wind_hub:
    station_id: "FI_VAA"
    latitude: 63.0951
    longitude: 21.6165

# Coordinate municipality name standardisation mapping
coordinate_df_replace_mapping:
  Narpes: "Närpiö"
  Pyhanta: "Pyhäntä"
  Lestijarvi: "Lestijärvi"
  Pietarsaari: "Jakobstad"

# BigQuery Star Schema tables and analytical 360 views
bq_tables:
  dim_datetime: "dim_datetime"
  dim_fuel_type: "dim_fuel_type"
  dim_power_unit: "dim_power_unit"
  dim_fi_city: "dim_fi_city"
  dim_fi_region: "dim_fi_region"
  fct_unit_generation: "fct_unit_generation_15min"
  fct_fuel_generation: "fct_fuel_generation_15min"
  fct_day_ahead_price: "fct_day_ahead_price_15min"
  fct_weather: "fct_weather_15min"
  vw_unit_generation_360: "vw_unit_generation_360"
  vw_fuel_generation_360: "vw_fuel_generation_360"
  vw_regional_generation_summary: "vw_regional_generation_summary"
