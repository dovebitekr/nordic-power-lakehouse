services:
  airflow:
    build: .
    container_name: nordic_power_airflow
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_HOME: /opt/airflow
      PYTHONPATH: /opt/airflow
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/.google/credentials/adc.json
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./common:/opt/airflow/common
      - ./ingestion:/opt/airflow/ingestion
      - ./resources:/opt/airflow/resources
      - ./data:/opt/airflow/data
      - ${HOME}/.config/gcloud/application_default_credentials.json:/opt/airflow/.google/credentials/adc.json:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate
        airflow users create --username airflow --password airflow --firstname Admin --lastname User --role Admin --email admin@example.com || true
        airflow scheduler &
        exec airflow webserver --port 8080
